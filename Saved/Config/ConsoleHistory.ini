History="import unreal\r\nimport os\r\n\r\ndef etape_01_structure_clean():\r\n    eal = unreal.EditorAssetLibrary()\r\n    \r\n    # Données basées sur votre ListeDesDossiers.txt\r\n    folders_data = [\r\n        # --- AI ---\r\n        (\"Project/AI/BehaviorTrees\", \"Le flux de décision principal (BT_).\"),\r\n        (\"Project/AI/BehaviorTrees/Tasks\", \"Actions personnalisées du Behavior Tree (BTT_).\"),\r\n        (\"Project/AI/BehaviorTrees/Decorators\", \"Conditions pour bloquer ou autoriser l\'exécution (BTD_).\"),\r\n        (\"Project/AI/BehaviorTrees/Services\", \"Mises à jour régulières des variables (BTS_).\"),\r\n        (\"Project/AI/StateTrees\", \"Arbres d\'états pour la logique et la prise de décision (ST_).\"),\r\n        (\"Project/AI/StateTrees/Tasks\", \"Actions spécifiques exécutées dans les états (STT_).\"),\r\n        (\"Project/AI/StateTrees/Evaluators\", \"Évaluateurs pour calculer des données avant transition (STE_).\"),\r\n        (\"Project/AI/StateTrees/Conditions\", \"Conditions pour valider les transitions entre les états (STC_).\"),\r\n        (\"Project/AI/Blackboards\", \"La mémoire de l\'IA (BB_).\"),\r\n        (\"Project/AI/Controllers\", \"L\'acteur qui possède et guide le NPC (AIC_).\"),\r\n\r\n         # --- ANIMATIONS ---\r\n        (\"Project/Animations/Player\", \"Contient les AnimBP, BlendSpaces et Séquences du joueur.\"),\r\n        (\"Project/Animations/NPCs\", \"Anims des ennemis et PNJs.\"),\r\n\r\n         # --- AUDIO ---\r\n        (\"Project/Audio/Music\", \"Pour les musiques de fond et d\'ambiance.\"),\r\n        (\"Project/Audio/SFX\", \"Pour les bruitages courts (tirs, pas, impacts).\"),\r\n\r\n         # --- BLUEPRINTS ---\r\n        (\"Project/Blueprints/Actors\", \"Objets interactifs du monde (portes, items, pièges).\"),\r\n        (\"Project/Blueprints/Components\", \"Composants réutilisables à ajouter aux acteurs.\"),\r\n        (\"Project/Blueprints/Core\", \"LE CADRE : GameMode, PlayerController, GameInstance.\"),\r\n        (\"Project/Blueprints/Interfaces\", \"Blueprint Interfaces pour la communication.\"),\r\n        (\"Project/Blueprints/Characters/Player\", \"Le héros contrôlé par le joueur.\"),\r\n        (\"Project/Blueprints/Characters/NPCs\", \"Les ennemis et personnages Non-Joueurs.\"),\r\n\r\n        # --- MAPS ---\r\n        (\"Project/Maps/Development\", \"Niveaux de test et bacs à sable.\"),\r\n        (\"Project/Maps/Main\", \"Les niveaux officiels du jeu final.\"),\r\n\r\n        # --- MATERIALS ---\r\n        (\"Project/Materials/Master\", \"Les matériaux parents complexes.\"),\r\n        (\"Project/Materials/Instances\", \"Les instances (MI_) pour changer les couleurs/textures.\"),\r\n\r\n        # --- MESHES ---\r\n        (\"Project/Meshes/Props\", \"Objets statiques de décor (SM_).\"),\r\n        (\"Project/Meshes/Characters\", \"Modèles 3D des personnages (Skeletal Meshes).\"),\r\n\t    (\"Project/Meshes/Destructibles/GeometryCollections\", \"Les objets 3D fracturés (GC_).\"),\r\n        (\"Project/Meshes/Destructibles/Fields\", \"Blueprints Field System pour diriger et contrôler les brisures (FS_).\"),\r\n\r\n        # --- TEXTURES & VFX ---\r\n        (\"Project/Textures\", \"Toutes les images importées.\"),\r\n        (\"Project/VFX/Niagara\", \"Particules et Effets Visuels.\"),\r\n\r\n        # --- SYSTEMS ---\r\n        (\"Project/Systems/Enums\", \"Enumerations (Listes d\'états).\"),\r\n        (\"Project/Systems/Input\", \"Fichiers Enhanced Input (IMC_, IA_).\"),\r\n        (\"Project/Systems/Save_Data\", \"Système de sauvegarde.\"),\r\n        (\"Project/Systems/Structs\", \"Structures de données.\"),\r\n\r\n        # --- UI ---\r\n        (\"Project/UI/Blueprints\", \"Les Widgets (WBP_) pour l\'interface.\"),\r\n        (\"Project/UI/Fonts\", \"Polices d\'écriture.\"),\r\n        (\"Project/UI/Assets\", \"Images spécifiques à l\'interface.\")\r\n    ]\r\n\r\n    # 1. Création du dossier spécial _External\r\n    eal.make_directory(\"/Game/_External/BaseTemplate\")\r\n    \r\n    # 2. Boucle de création des dossiers et fichiers .txt\r\n    content_dir = unreal.Paths.project_content_dir()\r\n    \r\n    for path, desc in folders_data:\r\n        ue_path = \"/Game/\" + path\r\n        eal.make_directory(ue_path)\r\n        \r\n        # Création physique du fichier description\r\n        full_disk_path = os.path.join(content_dir, path)\r\n        if not os.path.exists(full_disk_path):\r\n            os.makedirs(full_disk_path)\r\n            \r\n        desc_file = os.path.join(full_disk_path, \"DescriptionDossier.txt\")\r\n        with open(desc_file, \"w\", encoding=\"utf-8\") as f:\r\n            f.write(desc)\r\n\r\n    unreal.log(\"SCRIPT 1 TERMINÉ : Structure et documentation créées.\")\r\n\r\netape_01_structure_clean()"
History="\r\ndef etape_02_force_core_assets():\r\n    eal = unreal.EditorAssetLibrary()\r\n    at = unreal.AssetToolsHelpers.get_asset_tools()\r\n    \r\n    # Sauvegarde préventive\r\n    unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)\r\n\r\n    target_base = \"/Game/Project/Animations/Player\"\r\n    \r\n    # [cite_start]Liste précise des fichiers critiques (Basée sur ListeDesDossiersDepart.txt [cite: 32-33])\r\n    critical_assets = [\r\n        # Squelette (Doit bouger en premier)\r\n        (\"/Game/Characters/Mannequins/Meshes/SK_Mannequin\", target_base + \"/Characters/Mannequins/Meshes\"),\r\n        (\"/Game/Characters/Mannequins/Rigs/PA_Mannequin\", target_base + \"/Characters/Mannequins/Rigs\"),\r\n        # Les Maillages Skelettiques\r\n        (\"/Game/Characters/Mannequins/Meshes/SKM_Manny_Simple\", target_base + \"/Characters/Mannequins/Meshes\"),\r\n        (\"/Game/Characters/Mannequins/Meshes/SKM_Quinn_Simple\", target_base + \"/Characters/Mannequins/Meshes\")\r\n    ]\r\n\r\n    unreal.log(\"--- DÉBUT FORÇAGE CRITIQUE ---\")\r\n\r\n    for src, dst_folder in critical_assets:\r\n        asset_name = src.split(\"/\")[-1]\r\n        final_path = dst_folder + \"/\" + asset_name\r\n\r\n        if eal.does_asset_exist(src):\r\n            asset_obj = eal.load_asset(src)\r\n            \r\n            # Création du dossier si nécessaire\r\n            if not eal.does_directory_exist(dst_folder):\r\n                eal.make_directory(dst_folder)\r\n\r\n            # Consolidate (Fusion) si la destination existe déjà\r\n            if eal.does_asset_exist(final_path):\r\n                unreal.log(f\"Fusion de {asset_name}...\")\r\n                dest_obj = eal.load_asset(final_path)\r\n                at.consolidate_assets(dest_obj, [asset_obj])\r\n            else:\r\n                unreal.log(f\"Déplacement de {asset_name}...\")\r\n                at.rename_assets([unreal.AssetRenameData(asset=asset_obj, new_package_path=dst_folder, new_name=asset_name)])\r\n\r\n    # Sauvegarde IMMEDIATE\r\n    unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)\r\n    unreal.log(\"SCRIPT 2 TERMINÉ : Assets critiques sécurisés.\")\r\n\r\netape_02_force_core_assets()\r\n"
History="import unreal\r\n\r\ndef etape_03_transfert_global():\r\n    eal = unreal.EditorAssetLibrary()\r\n    at = unreal.AssetToolsHelpers.get_asset_tools()\r\n\r\n    unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)\r\n    \r\n    # 1. TRAITEMENT DES DOSSIERS COMPLETS\r\n    folder_tasks = [\r\n        (\"/Game/Characters\", \"/Game/Project/Animations/Player\"), # Tout ce qui reste dans Characters\r\n        (\"/Game/LevelPrototyping\", \"/Game/_External\"),\r\n        (\"/Game/FirstPerson/Anims\", \"/Game/Project/Animations/Player\"),\r\n        (\"/Game/Input\", \"/Game/Project/Systems/Input\") # Gère aussi le sous-dossier Actions\r\n    ]\r\n\r\n    assets_to_move = []\r\n\r\n    for src_folder, dst_root in folder_tasks:\r\n        if eal.does_directory_exist(src_folder):\r\n            files = eal.list_assets(src_folder, recursive=True)\r\n            \r\n            for f_path in files:\r\n                asset_obj = eal.load_asset(f_path)\r\n                if not asset_obj: continue\r\n\r\n                # Calcul intelligent du chemin de destination\r\n                rel_path = f_path.replace(src_folder, \"\")\r\n                path_only = unreal.Paths.get_path(rel_path)\r\n                folder_name_src = src_folder.split(\"/\")[-1]\r\n                \r\n                # Logique spéciale : éviter .../Input/Input/\r\n                if folder_name_src == \"Input\":\r\n                    final_folder = (dst_root + path_only).rstrip(\"/\")\r\n                else:\r\n                    final_folder = (dst_root + \"/\" + folder_name_src + path_only).rstrip(\"/\")\r\n\r\n                assets_to_move.append(unreal.AssetRenameData(\r\n                    asset=asset_obj,\r\n                    new_package_path=final_folder,\r\n                    new_name=unreal.SystemLibrary.get_object_name(asset_obj)\r\n                ))\r\n\r\n    # 2. TRAITEMENT DES FICHIERS UNIQUES (First Person BP & Maps)\r\n    single_files = [\r\n        (\"/Game/FirstPerson/Lvl_FirstPerson\", \"/Game/_External/BaseTemplate\"),\r\n        (\"/Game/FirstPerson/MI_FirstPersonColorway\", \"/Game/_External/BaseTemplate\"),\r\n        (\"/Game/FirstPerson/Blueprints/BP_FirstPersonPlayerController\", \"/Game/Project/Blueprints/Core\"),\r\n        (\"/Game/FirstPerson/Blueprints/BP_FirstPersonGameMode\", \"/Game/Project/Blueprints/Core\"),\r\n        (\"/Game/FirstPerson/Blueprints/BP_FirstPersonCameraManager\", \"/Game/Project/Blueprints/Core\"),\r\n        (\"/Game/FirstPerson/Blueprints/BP_FirstPersonCharacter\", \"/Game/Project/Blueprints/Characters/Player\"),\r\n        (\"/Game/Input/Touch\", \"/Game/Project/UI/Blueprints\") # Cas spécial Touch\r\n    ]\r\n\r\n    for src, dst in single_files:\r\n        if eal.does_asset_exist(src):\r\n            obj = eal.load_asset(src)\r\n            assets_to_move.append(unreal.AssetRenameData(\r\n                asset=obj,\r\n                new_package_path=dst,\r\n                new_name=unreal.SystemLibrary.get_object_name(obj)\r\n            ))\r\n        elif eal.does_directory_exist(src): # Pour Touch qui est un dossier\r\n             files = eal.list_assets(src, recursive=True)\r\n             for f in files:\r\n                 o = eal.load_asset(f)\r\n                 assets_to_move.append(unreal.AssetRenameData(asset=o, new_package_path=dst, new_name=unreal.SystemLibrary.get_object_name(o)))\r\n\r\n\r\n    # EXÉCUTION\r\n    if len(assets_to_move) > 0:\r\n        unreal.log(f\"Transfert de {len(assets_to_move)} fichiers...\")\r\n        at.rename_assets(assets_to_move)\r\n        unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)\r\n    \r\n    unreal.log(\"SCRIPT 3 TERMINÉ : Migration globale effectuée.\")\r\n\r\netape_03_transfert_global()"
History="import unreal\r\nimport os\r\nimport shutil\r\nimport stat\r\n\r\ndef script_04_nettoyage_intelligent():\r\n    unreal.log(\"--- DÉBUT SCRIPT 4 : NETTOYAGE INTELLIGENT ---\")\r\n    \r\n    # Libérer la mémoire\r\n    unreal.SystemLibrary.collect_garbage()\r\n    \r\n    content_dir = unreal.Paths.convert_relative_path_to_full(unreal.Paths.project_content_dir())\r\n    \r\n    folders_to_clean = [\r\n        \"FirstPerson\",\r\n        \"Characters\",\r\n        \"LevelPrototyping\",\r\n        \"Input\"\r\n    ]\r\n\r\n    # Fonction de gestion d\'erreur (Callback)\r\n    def gestion_erreur(func, path, exc_info):\r\n        # Si le fichier n\'existe pas (ex: ._Meshes fantôme), on ignore\r\n        if not os.path.exists(path):\r\n            return\r\n        # Si le fichier est en lecture seule, on le déverrouille\r\n        if not os.access(path, os.W_OK):\r\n            os.chmod(path, stat.S_IWRITE)\r\n            func(path)\r\n        else:\r\n            unreal.log_warning(f\"Problème suppression : {path}\")\r\n\r\n    for folder_name in folders_to_clean:\r\n        full_path = os.path.join(content_dir, folder_name)\r\n        \r\n        if os.path.exists(full_path):\r\n            # SÉCURITÉ : Vérification d\'Assets Unreal restants\r\n            has_assets = False\r\n            for root, dirs, files in os.walk(full_path):\r\n                for file in files:\r\n                    if file.endswith(\".uasset\") or file.endswith(\".umap\"):\r\n                        has_assets = True\r\n                        break\r\n                if has_assets: break\r\n            \r\n            if has_assets:\r\n                unreal.log_error(f\"❌ SUPPRESSION ANNULÉE : {folder_name} contient encore des .uasset.\")\r\n                continue\r\n\r\n            # Suppression propre\r\n            try:\r\n                shutil.rmtree(full_path, onerror=gestion_erreur) \r\n                unreal.log(f\"✅ Dossier nettoyé : {folder_name}\")\r\n            except Exception as e:\r\n                unreal.log_error(f\"Erreur : {e}\")\r\n        else:\r\n            unreal.log(f\"Déjà propre : {folder_name}\")\r\n\r\n    unreal.log(\"--- TERMINÉ ---\")\r\n\r\nscript_04_nettoyage_intelligent()"

